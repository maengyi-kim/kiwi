; Kiwi 传感器节点固件 — PlatformIO 项目配置
; 目标: STM32F103C8T6 Blue Pill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.2.0

build_flags =
    -D KIWI_NODE
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; 如需改为水位计版本:
; build_flags = -D KIWI_WATER_NODE

; 如需调试输出:
; build_flags = -D KIWI_DEBUG
