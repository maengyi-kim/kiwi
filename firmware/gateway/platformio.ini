; Kiwi LoRa 网关固件 — PlatformIO 项目配置
; 目标: ESP32 (Heltec WiFi LoRa 32 V3 或普通 ESP32 + SX1278)

[env:heltec]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.2.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0

build_flags =
    -D KIWI_GATEWAY
    -D OLED_ENABLED

; 如果用普通 ESP32 + 独立 SX1278:
; [env:esp32]
; platform = espressif32
; board = esp32dev
; framework = arduino
; build_flags = -D KIWI_GATEWAY
